name: Crear APK de DEPORTE TOTAL 360

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/zona-live-catalog-20261103
      - feature/cloudflare-channel-catalog-20261105
      # Rama de integración de confianza: compila APK firmada en eventos push,
      # sin exponer secretos durante las comprobaciones pull_request.
      - codex/complete-live-schedule
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restaurar imágenes de la versión anterior
        run: |
          mkdir -p assets/images
          git show 43231586021aab083fa3ea0248d672d1209eb495:assets/images/home_reference.png > assets/images/home_reference.png
          git show 43231586021aab083fa3ea0248d672d1209eb495:assets/images/logo.png > assets/images/logo.png
          test -s assets/images/home_reference.png
          test -s assets/images/logo.png
          file assets/images/home_reference.png assets/images/logo.png

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Preparar archivos Android
        run: flutter create --platforms=android .

      # Los pull requests ejecutan análisis y pruebas, sin acceso a la llave privada.
      - name: Habilitar Internet en el APK release
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text(encoding='utf-8')

          permissions = (
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.RECEIVE_BOOT_COMPLETED',
          )

          for permission in permissions:
              declaration = (
                  f'<uses-permission android:name="{permission}" />'
              )

              if f'android:name="{permission}"' not in content:
                  content, count = re.subn(
                      r'(<manifest\b[^>]*>)',
                      lambda match: (
                          match.group(1) + '\n    ' + declaration
                      ),
                      content,
                      count=1,
                  )

                  if count != 1:
                      raise SystemExit(
                          'No se pudo modificar AndroidManifest.xml'
                      )

          if 'android:hardwareAccelerated=' not in content:
              content = re.sub(
                  r'(<application\b)',
                  r'\1 android:hardwareAccelerated="true"',
                  content,
                  count=1,
              )

          receivers = '''
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                  android:exported="false" />
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          '''

          if 'ScheduledNotificationBootReceiver' not in content:
              content = content.replace('</application>', receivers + '\n</application>', 1)

          manifest.write_text(content, encoding='utf-8')
          PY

      - name: Configurar desugaring para notificaciones
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          kotlin = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kotlin.exists():
              path = kotlin
              content = path.read_text(encoding='utf-8')
              flag = 'isCoreLibraryDesugaringEnabled = true'
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'

              if not re.search(r'(?m)^\s*compileOptions\s*\{', content):
                  raise SystemExit('No se encontró compileOptions en build.gradle.kts')
              if flag not in content:
                  content = re.sub(
                      r'(?m)^(\s*compileOptions\s*\{)',
                      r'\1\n        ' + flag,
                      content,
                      count=1,
                  )

              if dependency not in content:
                  match = re.search(r'(?m)^(\s*dependencies\s*\{)', content)
                  if match:
                      content = (
                          content[:match.end()] + '\n    ' + dependency +
                          content[match.end():]
                      )
                  else:
                      content += '\n\ndependencies {\n    ' + dependency + '\n}\n'

              if flag not in content or dependency not in content:
                  raise SystemExit('No quedó configurado el desugaring en build.gradle.kts')
              path.write_text(content, encoding='utf-8')
              print('Desugaring Kotlin DSL verificado:')
              print(dependency)

          elif groovy.exists():
              path = groovy
              content = path.read_text(encoding='utf-8')
              flag = 'coreLibraryDesugaringEnabled true'
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

              if not re.search(r'(?m)^\s*compileOptions\s*\{', content):
                  raise SystemExit('No se encontró compileOptions en build.gradle')
              if flag not in content:
                  content = re.sub(
                      r'(?m)^(\s*compileOptions\s*\{)',
                      r'\1\n        ' + flag,
                      content,
                      count=1,
                  )

              if dependency not in content:
                  match = re.search(r'(?m)^(\s*dependencies\s*\{)', content)
                  if match:
                      content = (
                          content[:match.end()] + '\n    ' + dependency +
                          content[match.end():]
                      )
                  else:
                      content += '\n\ndependencies {\n    ' + dependency + '\n}\n'

              if flag not in content or dependency not in content:
                  raise SystemExit('No quedó configurado el desugaring en build.gradle')
              path.write_text(content, encoding='utf-8')
              print('Desugaring Groovy verificado:')
              print(dependency)
          else:
              raise SystemExit('No se encontró el archivo Gradle de la app Android')
          PY


      - name: Configurar compatibilidad de ProGuard
        run: |
          FILE="android/gradle.properties"
          touch "$FILE"

          if ! grep -q '^android.r8.proguardAndroidTxt.disallowed=' "$FILE"; then
            echo 'android.r8.proguardAndroidTxt.disallowed=false' >> "$FILE"
          fi

      - name: Instalar Android NDK con reintentos
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "No se encontró sdkmanager en: $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          for attempt in 1 2 3; do
            echo "Instalación del NDK: intento $attempt de 3"

            if [[ -f "$NDK_DIR/source.properties" ]]; then
              echo "El NDK ya está instalado correctamente."
              exit 0
            fi

            rm -rf "$NDK_DIR"
            rm -rf "$SDK_ROOT/.temp/"* "$SDK_ROOT/temp/"* 2>/dev/null || true

            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"; then
              if [[ -f "$NDK_DIR/source.properties" ]]; then
                echo "NDK instalado correctamente."
                cat "$NDK_DIR/source.properties"
                exit 0
              fi
            fi

            echo "Falló la instalación del NDK."
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done

          echo "ERROR: No se pudo instalar el NDK después de 3 intentos."
          exit 1

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar icono Android
        run: dart run flutter_launcher_icons

      - name: Analizar código Flutter
        run: flutter analyze lib test --no-fatal-infos

      - name: Ejecutar pruebas automatizadas
        env:
          TZ: America/Guyana
        run: flutter test

      # La llave privada de distribución se conserva en GitHub Secrets, nunca en caché ni en el repositorio.
      - name: Preparar firma privada y estable para Android
        if: github.event_name != 'pull_request'
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD. Configúralos en Settings > Secrets and variables > Actions. No se generará una firma temporal."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/deporte-total-360-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "Tipo y tamaño de la keystore decodificada:"
          file "$KEYSTORE"
          stat -c 'Tamaño: %s bytes' "$KEYSTORE"

          # Primero validamos la contraseña y enumeramos alias sin exponer secretos.
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD"; then
            echo "::error::La keystore decodificada no se puede abrir con ANDROID_KEYSTORE_PASSWORD. Revisa que ANDROID_KEYSTORE_BASE64 corresponda al archivo JKS original y que ANDROID_KEYSTORE_PASSWORD sea exactamente su contraseña."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias dt360 >/dev/null; then
            echo "::error::La keystore se abrió, pero no contiene el alias dt360. No se modificará ni reemplazará la llave."
            exit 1
          fi

          KEYSTORE_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias dt360 | sed -n 's/^[[:space:]]*SHA1: //Ip' | head -n 1 | tr -d '[:space:]')"
          if [[ -z "$KEYSTORE_SHA1" ]]; then
            echo "::error::No se pudo leer el SHA-1 de la llave Android privada."
            exit 1
          fi
          echo "sha1=$KEYSTORE_SHA1" >> "$GITHUB_OUTPUT"
          echo "Huella de firma privada preparada: $KEYSTORE_SHA1"

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=dt360
          storeFile=$KEYSTORE
          EOF
          chmod 600 android/key.properties

          if [[ -f android/app/build.gradle.kts ]]; then
            cat >> android/app/build.gradle.kts <<'KTS'

          // Firma release con la llave privada guardada en GitHub Actions Secrets.
          // Leer el archivo como mapa evita depender de imports Java en Kotlin DSL.
          val dt360SigningProperties = rootProject.file("key.properties")
              .readLines()
              .filter { it.contains("=") }
              .associate { line ->
                  line.substringBefore("=").trim() to line.substringAfter("=").trim()
              }
          android {
              signingConfigs {
                  create("dt360Release") {
                      keyAlias = dt360SigningProperties["keyAlias"] ?: error("Falta keyAlias en key.properties")
                      keyPassword = dt360SigningProperties["keyPassword"] ?: error("Falta keyPassword en key.properties")
                      storeFile = file(dt360SigningProperties["storeFile"] ?: error("Falta storeFile en key.properties"))
                      storePassword = dt360SigningProperties["storePassword"] ?: error("Falta storePassword en key.properties")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("dt360Release")
                  }
              }
          }
          KTS
          elif [[ -f android/app/build.gradle ]]; then
            cat >> android/app/build.gradle <<'GROOVY'

          // Firma release con la llave privada guardada en GitHub Actions Secrets.
          def dt360SigningProperties = new Properties()
          rootProject.file('key.properties').withInputStream { dt360SigningProperties.load(it) }
          android {
              signingConfigs {
                  create('dt360Release') {
                      keyAlias = dt360SigningProperties['keyAlias']
                      keyPassword = dt360SigningProperties['keyPassword']
                      storeFile = file(dt360SigningProperties['storeFile'])
                      storePassword = dt360SigningProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dt360Release
                  }
              }
          }
          GROOVY
          else
            echo "::error::No se encontró el archivo Gradle de Android para configurar la firma."
            exit 1
          fi


      - name: Validar el ID de cliente OAuth Web
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$GOOGLE_OAUTH_CLIENT_ID" ]]; then
            echo "::error::Falta el secreto GOOGLE_OAUTH_CLIENT_ID en este repositorio."
            exit 1
          fi
          if [[ "$GOOGLE_OAUTH_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID no parece ser un ID de cliente OAuth Web."
            exit 1
          fi
          echo "El ID de cliente OAuth Web está configurado. Su valor permanece oculto."

      - name: Verificar que APK y Cloudflare usan el mismo cliente OAuth Web
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          OAUTH_CONFIG="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://deporte-total-360-api.damian970609.workers.dev/api/channels/auth-config)"
          node - "$OAUTH_CONFIG" <<'NODE'
          const config = JSON.parse(process.argv[2]);
          const appClientId = process.env.GOOGLE_OAUTH_CLIENT_ID;
          if (!appClientId || config.configured !== true || config.clientId !== appClientId) {
            throw new Error("El secreto GOOGLE_OAUTH_CLIENT_ID de la APK no coincide con el cliente OAuth Web publicado en Cloudflare.");
          }
          console.log("El cliente OAuth Web de la APK coincide con Cloudflare. El valor se mantiene oculto.");
          NODE
      - name: Compilar APK de producción
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID"

      - name: Obtener datos exactos y verificar firma OAuth Android
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_SHA1: ${{ steps.android_signing.outputs.sha1 }}
        run: |
          set -Eeuo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT" || { echo "::error::No se encontró aapt en Android Build Tools."; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::No se encontró apksigner en Android Build Tools."; exit 1; }
          PACKAGE_NAME="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK")"
          APK_SHA1="$(printf '%s\n' "$CERT_INFO" | grep -i 'certificate SHA-1 digest:' | head -n 1 | awk -F': ' '{print $NF}' | tr -d '[:space:]')"
          normalize_sha1() { printf '%s' "$1" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]'; }
          EXPECTED_SHA1="$(normalize_sha1 "$ANDROID_KEYSTORE_SHA1")"
          ACTUAL_SHA1="$(normalize_sha1 "$APK_SHA1")"
          if [[ "$PACKAGE_NAME" != "com.example.deporte_total_360" ]]; then
            echo "::error::El package name cambió inesperadamente: $PACKAGE_NAME"
            exit 1
          fi
          if [[ -z "$ACTUAL_SHA1" || "$EXPECTED_SHA1" != "$ACTUAL_SHA1" ]]; then
            echo "::error::La APK no quedó firmada con la llave privada configurada. No se publicará este artefacto."
            echo "SHA-1 esperado: $ANDROID_KEYSTORE_SHA1"
            echo "SHA-1 de la APK: $APK_SHA1"
            exit 1
          fi
          SHA1_FORMATTED="$(printf '%s' "$ACTUAL_SHA1" | sed 's/../&:/g; s/:$//')"
          {
            echo "## Datos para registrar OAuth Android en Google Cloud"
            echo
            echo "- **Tipo de cliente:** Android"
            echo "- **Package name:** \`$PACKAGE_NAME\`"
            echo "- **SHA-1 verificado del APK:** \`$SHA1_FORMATTED\`"
            echo
            echo "El workflow verificó que el certificado real del APK coincide con la llave privada de GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Package name Android: $PACKAGE_NAME"
          echo "SHA-1 verificado del APK: $SHA1_FORMATTED"
      - name: Guardar APK para descargar
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: deporte-total-360-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30