name: Crear APK de Deporte Total 360

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Analizar, probar y compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar Dart
        run: flutter analyze --no-pub

      - name: Ejecutar pruebas
        run: flutter test --no-pub

      - name: Generar estructura Android
        run: flutter create --platforms=android .

      - name: Preparar permisos y nombre Android
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                  text,
                  count=1,
              )
          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="Deporte Total 360°"',
              text,
              count=1,
          )
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Compilar APK release
        run: flutter build apk --release --no-pub

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Deporte-Total-360-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
