name: Crear APK de DEPORTE TOTAL 360

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"

      - name: Generar archivos de Android
        run: flutter create --platforms=android .

      - name: Corregir compatibilidad de ProGuard
        run: echo 'android.r8.proguardAndroidTxt.disallowed=false' >> android/gradle.properties

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze lib

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: deporte-total-360-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error