name: Crear APK de DEPORTE TOTAL 360

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Preparar archivos Android
        run: flutter create --platforms=android .

      - name: Configurar compatibilidad de ProGuard
        run: |
          FILE="android/gradle.properties"
          touch "$FILE"
          if ! grep -q '^android.r8.proguardAndroidTxt.disallowed=' "$FILE"; then
            echo 'android.r8.proguardAndroidTxt.disallowed=false' >> "$FILE"
          fi

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar icono Android
        run: dart run flutter_launcher_icons

      - name: Analizar código Flutter
        run: flutter analyze lib

      - name: Compilar APK de producción
        run: flutter build apk --release

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: deporte-total-360-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30